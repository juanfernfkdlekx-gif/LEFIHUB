<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeHub - Inicio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2ff;
    display:flex;
    min-height:100vh;
    transition:.3s;
}

.menu{
    width:250px;
    height:100vh;
    background:#4F46E5;
    padding:25px;
    color:white;
    position:fixed;
}

.menu h1{
    margin-bottom:40px;
    font-size:28px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    transition:.3s;
}

.menu a:hover{
    background:white;
    color:#4F46E5;
}

.menu a.activo{
    background:white;
    color:#4F46E5;
    font-weight:bold;
}

.contenido{
    margin-left:270px;
    padding:40px;
    width:100%;
    max-width:900px;
}

.bienvenida{
    margin-bottom:30px;
}

.bienvenida h2{
    font-size:26px;
    margin-bottom:6px;
}

.bienvenida p{
    color:#555;
}

#botonModo{
    margin-bottom:25px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:white;
    cursor:pointer;
    transition:.3s;
}

#botonModo:hover{
    transform:scale(1.03);
}

.grid-tarjetas{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:20px;
    margin-bottom:30px;
}

.tarjeta{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    text-decoration:none;
    color:inherit;
    display:block;
    transition:.2s;
}

.tarjeta:hover{
    transform:translateY(-4px);
}

.tarjeta .icono{
    font-size:28px;
    margin-bottom:10px;
}

.tarjeta .numero{
    font-size:32px;
    font-weight:bold;
    margin:5px 0;
    color:#4F46E5;
}

.tarjeta .etiqueta{
    color:#666;
    font-size:14px;
}

.accesos{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.accesos h3{
    margin-bottom:15px;
}

.lista-accesos{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.lista-accesos a{
    background:#eef2ff;
    color:#4F46E5;
    padding:12px 18px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.lista-accesos a:hover{
    background:#4F46E5;
    color:white;
}

/* ==========================
   MODO OSCURO
========================== */

body.modoOscuro{
    background:#121212;
    color:white;
}

body.modoOscuro .tarjeta,
body.modoOscuro .accesos{
    background:#1E1E1E;
    color:white;
}

body.modoOscuro .menu{
    background:#181818;
}

body.modoOscuro .bienvenida p{
    color:#bbb;
}

body.modoOscuro .tarjeta .etiqueta{
    color:#aaa;
}

body.modoOscuro .lista-accesos a{
    background:#2A2A2A;
    color:#8b93ff;
}

body.modoOscuro .lista-accesos a:hover{
    background:#4F46E5;
    color:white;
}

</style>

</head>

<body>

<div class="menu">

    <h1>🌟 LifeHub</h1>

    <a href="index.html" class="activo">🏠 Inicio</a>
    <a href="tareas.html">✅ Mis tareas</a>
    <a href="calendario.html">📅 Calendario</a>
    <a href="notas.html">📝 Notas</a>
    <a href="metas.html">🎯 Metas</a>
    <a href="configuracion.html">⚙ Configuración</a>

</div>

<div class="contenido">

    <div class="bienvenida">
        <h2 id="saludo">¡Hola! 👋</h2>
        <p>Este es tu resumen de hoy en LifeHub.</p>
    </div>

    <button id="botonModo" onclick="cambiarModo()">🌙 Modo oscuro</button>

    <div class="grid-tarjetas">

        <a href="tareas.html" class="tarjeta">
            <div class="icono">✅</div>
            <div class="numero" id="numTareas">0</div>
            <div class="etiqueta">Tareas pendientes</div>
        </a>

        <a href="notas.html" class="tarjeta">
            <div class="icono">📝</div>
            <div class="numero" id="numNotas">0</div>
            <div class="etiqueta">Notas guardadas</div>
        </a>

        <a href="metas.html" class="tarjeta">
            <div class="icono">🎯</div>
            <div class="numero" id="numMetas">0%</div>
            <div class="etiqueta">Progreso de metas</div>
        </a>

    </div>

    <div class="accesos">
        <h3>Accesos rápidos</h3>
        <div class="lista-accesos">
            <a href="tareas.html">➕ Agregar tarea</a>
            <a href="notas.html">📝 Nueva nota</a>
            <a href="metas.html">🎯 Nueva meta</a>
            <a href="calendario.html">📅 Ver calendario</a>
        </div>
    </div>

</div>

<script>

window.addEventListener("load", function(){

    let modo = localStorage.getItem("modo");
    if(modo === "oscuro"){
        document.body.classList.add("modoOscuro");
        document.getElementById("botonModo").innerHTML = "☀️ Modo claro";
    }

    mostrarSaludo();
    cargarResumen();

});

function cambiarModo(){

    document.body.classList.toggle("modoOscuro");

    if(document.body.classList.contains("modoOscuro")){
        localStorage.setItem("modo","oscuro");
        document.getElementById("botonModo").innerHTML = "☀️ Modo claro";
    }else{
        localStorage.setItem("modo","claro");
        document.getElementById("botonModo").innerHTML = "🌙 Modo oscuro";
    }

}

function mostrarSaludo(){

    let hora = new Date().getHours();
    let saludo = "¡Hola! 👋";

    if(hora < 12){
        saludo = "¡Buenos días! ☀️";
    }else if(hora < 19){
        saludo = "¡Buenas tardes! 🌤️";
    }else{
        saludo = "¡Buenas noches! 🌙";
    }

    document.getElementById("saludo").textContent = saludo;

}

function cargarResumen(){

    let tareas = JSON.parse(localStorage.getItem("tareas")) || [];
    let notas = JSON.parse(localStorage.getItem("notas")) || [];
    let metas = JSON.parse(localStorage.getItem("metas")) || [];

    document.getElementById("numTareas").textContent = tareas.length;
    document.getElementById("numNotas").textContent = notas.length;

    if(metas.length === 0){
        document.getElementById("numMetas").textContent = "0%";
    }else{
        let completadas = metas.filter(m => m.completada).length;
        let progreso = Math.round((completadas / metas.length) * 100);
        document.getElementById("numMetas").textContent = progreso + "%";
    }

}

</script>

</body>
</html>
