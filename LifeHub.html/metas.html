<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeHub - Metas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#eef2ff;
    display:flex;
    min-height:100vh;
    transition:.3s;
}

.menu{
    width:250px;
    height:100vh;
    background:#4F46E5;
    padding:25px;
    color:white;
    position:fixed;
}

.menu h1{
    margin-bottom:40px;
    font-size:28px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    transition:.3s;
}

.menu a:hover{
    background:white;
    color:#4F46E5;
}

.menu a.activo{
    background:white;
    color:#4F46E5;
    font-weight:bold;
}

.contenido{
    margin-left:270px;
    padding:40px;
    width:100%;
}

.tarjeta{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    max-width:700px;
}

h2{
    margin-bottom:20px;
}

#botonModo{
    margin-bottom:20px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:white;
    cursor:pointer;
    transition:.3s;
}

#botonModo:hover{
    transform:scale(1.03);
}

.fila-entrada{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    min-width:200px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    padding:12px 20px;
    background:#4F46E5;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    transition:.2s;
}

button:hover{
    background:#372fd3;
}

ul{
    list-style:none;
}

li{
    display:flex;
    flex-direction:column;
    gap:8px;
    background:#f8f8f8;
    padding:15px;
    margin-bottom:12px;
    border-radius:10px;
}

.fila-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.fila-meta span.texto{
    flex:1;
    word-break:break-word;
}

.fila-meta.completada span.texto{
    text-decoration:line-through;
    color:#888;
}

.barra{
    width:100%;
    height:10px;
    background:#e0e0e0;
    border-radius:20px;
    overflow:hidden;
}

.barra-relleno{
    height:100%;
    background:#10B981;
    transition:.3s;
}

.eliminar{
    background:#EF4444;
    padding:8px 12px;
    font-size:13px;
}

.eliminar:hover{
    background:#dc2626;
}

.check{
    width:20px;
    height:20px;
    cursor:pointer;
}

.vacio{
    text-align:center;
    color:#888;
    padding:20px 0;
}

/* ==========================
   MODO OSCURO
========================== */

body.modoOscuro{
    background:#121212;
    color:white;
}

body.modoOscuro .tarjeta{
    background:#1E1E1E;
    color:white;
}

body.modoOscuro .menu{
    background:#181818;
}

body.modoOscuro input{
    background:#2A2A2A;
    color:white;
    border:1px solid #555;
}

body.modoOscuro li{
    background:#2A2A2A;
    color:white;
}

body.modoOscuro .barra{
    background:#444;
}

body.modoOscuro .vacio{
    color:#aaa;
}

</style>

</head>

<body>

<div class="menu">

    <h1>🌟 LifeHub</h1>

    <a href="index.html">🏠 Inicio</a>
    <a href="index.html">✅ Mis tareas</a>
    <a href="calendario.html">📅 Calendario</a>
    <a href="notas.html">📝 Notas</a>
    <a href="metas.html" class="activo">🎯 Metas</a>
    <a href="configuracion.html">⚙ Configuración</a>

</div>

<div class="contenido">

    <div class="tarjeta">

        <h2>Metas</h2>

        <button id="botonModo" onclick="cambiarModo()">🌙 Modo oscuro</button>

        <div class="fila-entrada">
            <input type="text" id="nuevaMeta" placeholder="Escribe una meta">
            <button onclick="agregarMeta()">Agregar</button>
        </div>

        <ul id="listaMetas"></ul>

    </div>

</div>

<script>

window.addEventListener("load", function(){

    let modo = localStorage.getItem("modo");
    if(modo === "oscuro"){
        document.body.classList.add("modoOscuro");
        document.getElementById("botonModo").innerHTML = "☀️ Modo claro";
    }

    document.getElementById("nuevaMeta").addEventListener("keypress", function(e){
        if(e.key === "Enter"){
            agregarMeta();
        }
    });

    cargarMetas();

});

function cambiarModo(){

    document.body.classList.toggle("modoOscuro");

    if(document.body.classList.contains("modoOscuro")){
        localStorage.setItem("modo","oscuro");
        document.getElementById("botonModo").innerHTML = "☀️ Modo claro";
    }else{
        localStorage.setItem("modo","claro");
        document.getElementById("botonModo").innerHTML = "🌙 Modo oscuro";
    }

}

function obtenerMetas(){
    return JSON.parse(localStorage.getItem("metas")) || [];
}

function guardarMetas(metas){
    localStorage.setItem("metas", JSON.stringify(metas));
}

function agregarMeta(){

    let campo = document.getElementById("nuevaMeta");
    let texto = campo.value.trim();

    if(texto === ""){
        alert("Escribe una meta");
        return;
    }

    let metas = obtenerMetas();

    metas.push({ texto: texto, completada: false });

    guardarMetas(metas);

    campo.value = "";
    campo.focus();

    cargarMetas();

}

function alternarCompletada(indice){

    let metas = obtenerMetas();

    metas[indice].completada = !metas[indice].completada;

    guardarMetas(metas);

    cargarMetas();

}

function eliminarMeta(indice){

    let metas = obtenerMetas();

    metas.splice(indice, 1);

    guardarMetas(metas);

    cargarMetas();

}

function cargarMetas(){

    let lista = document.getElementById("listaMetas");
    lista.innerHTML = "";

    let metas = obtenerMetas();

    if(metas.length === 0){
        lista.innerHTML = '<p class="vacio">Todavía no tienes metas 🎯</p>';
        return;
    }

    let completadas = metas.filter(m => m.completada).length;
    let progreso = Math.round((completadas / metas.length) * 100);

    metas.forEach(function(meta, indice){

        let elemento = document.createElement("li");

        elemento.innerHTML = `
            <div class="fila-meta ${meta.completada ? "completada" : ""}">
                <input
                    type="checkbox"
                    class="check"
                    ${meta.completada ? "checked" : ""}
                    onchange="alternarCompletada(${indice})">
                <span class="texto">${meta.texto}</span>
                <button class="eliminar" onclick="eliminarMeta(${indice})">🗑</button>
            </div>
        `;

        lista.appendChild(elemento);

    });

    let resumen = document.createElement("li");
    resumen.innerHTML = `
        <div>
            <span>Progreso general: ${completadas} / ${metas.length} (${progreso}%)</span>
            <div class="barra">
                <div class="barra-relleno" style="width:${progreso}%"></div>
            </div>
        </div>
    `;
    lista.appendChild(resumen);

}

</script>

</body>
</html>
